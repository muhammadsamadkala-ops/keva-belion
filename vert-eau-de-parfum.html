</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="bottle-shape" viewBox="0 0 120 240">
    <rect x="42" y="4" width="36" height="20" rx="6" class="bottle-cap"/>
    <circle cx="60" cy="14" r="5" class="bottle-gem"/>
    <path d="M48 24 L48 46 Q48 58 34 64 Q20 70 20 92 L20 210 Q20 226 36 226 L84 226 Q100 226 100 210 L100 92 Q100 70 86 64 Q72 58 72 46 L72 24 Z" class="bottle-body"/>
    <rect x="20" y="120" width="80" height="3" class="bottle-band"/>
  </symbol>
</svg>

<div id="site-header"></div>

<div id="productDetailRoot"></div>

<div class="related" id="relatedRoot" style="display:none;">
  <h2>You may also like</h2>
  <div class="full-grid reveal-stagger" id="relatedGrid" style="padding:0;"></div>
</div>

<div id="site-footer-modals"></div>

<script src="partials.js?v=20261024d"></script>
<script src="data.js?v=20261024d"></script>
<script>
  const id = 'vert';
  const product = getProductById(id);
  const root = document.getElementById('productDetailRoot');

  if(!product){
    root.innerHTML = `
      <div class="page-header">
        <h1>Product not found</h1>
        <p>The fragrance you're looking for isn't in our collection. <a href="index.html" style="color:var(--gold-bright); text-decoration:underline;">Return home</a></p>
      </div>
    `;
  } else {
    const collectionHref = product.inspiredBy ? 'inspired-collection.html' : 'signature-collection.html';
    const collectionLabel = product.inspiredBy ? 'Inspired by Icons' : 'Signature Collection';

    const st = orderState(product);
    const sold = st !== 'ok';
    const pyr = product.pyramid;
    const pyramidHTML = pyr ? `
      <div class="pyramid">
        <h3 class="detail-sub">Fragrance notes</h3>
        ${[['Top','top'],['Heart','heart'],['Base','base']].map(([label,key]) => `
          <div class="pyr-row">
            <span class="pyr-label">${label}</span>
            <span class="pyr-notes">${(pyr[key]||[]).map(n => `<span class="note-chip">${n}</span>`).join('')}</span>
          </div>`).join('')}
      </div>` : '';

    const profileHTML = `
      <div class="profile-chips">
        ${product.family ? `<span class="profile-chip"><b>Family</b> ${FAMILY_LABEL[product.family]}</span>` : ''}
        ${product.gender ? `<span class="profile-chip"><b>Best for</b> ${GENDER_LABEL[product.gender]}</span>` : ''}
        ${product.intensity ? `<span class="profile-chip"><b>Strength</b> ${INTENSITY_LABEL[product.intensity]}</span>` : ''}
      </div>`;

    root.innerHTML = `
      <div class="product-detail">
        <div class="product-detail-visual">
          ${product.image ? '' : '<div class="glow"></div>'}
          ${product.image
            ? `<img src="${product.image}" alt="${product.name}" class="detail-photo">`
            : `<svg class="liquid-${product.id}" viewBox="0 0 120 240"><use href="#bottle-shape"/></svg>`}
        </div>
        <div class="product-detail-info">
          <div class="crumb"><a href="index.html">Home</a> / <a href="${collectionHref}">${collectionLabel}</a> / ${product.name}</div>
          ${product.inspiredBy ? `<div class="inspired-tag">Inspired by ${product.inspiredBy}</div>` : ''}
          <h1>${product.name}</h1>
          <div class="detail-size">Eau de Parfum · 100 ML</div>
          <div class="price">PKR ${product.price.toLocaleString()}${product.compareAtPrice ? ` <span class="compare-price">PKR ${product.compareAtPrice.toLocaleString()}</span>` : ''}</div>
          <p class="desc">${product.desc || ''}</p>
          ${profileHTML}
          ${pyramidHTML}
          <div class="qty-select-row" ${sold ? 'style="display:none"' : ''}>
            <button class="qty-btn" id="detailQtyMinus" aria-label="Decrease quantity">−</button>
            <span class="qty-val" id="detailQtyVal">1</span>
            <button class="qty-btn" id="detailQtyPlus" aria-label="Increase quantity">+</button>
          </div>
          <div class="detail-actions">
            <button class="btn btn-primary detail-add-btn" id="detailAddBtn" ${sold ? 'disabled' : ''}>${sold ? (st === 'soon' ? 'Coming soon' : 'Sold out') : 'Add to bag'}</button>
            <a class="btn btn-whatsapp detail-wa-btn" id="detailWaBtn" href="#" target="_blank" rel="noopener">${sold ? (st === 'soon' ? 'Notify me on WhatsApp' : "Ask when it's back") : 'Order via WhatsApp'}</a>
          </div>
          <div class="detail-meta">
            <div><span class="dot"></span> Cash on Delivery, or order directly on WhatsApp</div>
            <div><span class="dot"></span> Made by us in Karachi</div>
            <div><span class="dot"></span> 7-day returns on unopened bottles — <a href="returns.html" style="text-decoration:underline;">see policy</a></div>
          </div>
        </div>
      </div>
    `;

    let qty = 1;
    const qtyVal = document.getElementById('detailQtyVal');
    const waBtn = document.getElementById('detailWaBtn');
    // Sticky order bar (mobile): appears once the main buttons scroll out of view
    const bar = document.createElement('div');
    bar.className = 'sticky-order';
    bar.innerHTML = `
      <div class="so-info"><div class="so-name">${product.name}</div><div class="so-price">PKR ${product.price.toLocaleString()}</div></div>
      ${sold ? '' : '<button class="btn btn-ghost" id="soAdd">Add</button>'}
      <a class="btn btn-whatsapp" id="soWa" href="#" target="_blank" rel="noopener">${sold ? (st === 'soon' ? 'Notify me' : "Ask when it's back") : 'Order on WhatsApp'}</a>`;
    document.body.appendChild(bar);
    document.body.classList.add('has-sticky-order');
    const soWa = bar.querySelector('#soWa');
    const soAdd = bar.querySelector('#soAdd');
    if(soAdd) soAdd.addEventListener('click', (e)=>{
      addToCart(product.id, qty);
      e.target.textContent = 'Added ✓';
      setTimeout(()=>{ e.target.textContent = 'Add'; }, 1200);
    });
    if('IntersectionObserver' in window){
      new IntersectionObserver((entries)=>{
        entries.forEach(en => bar.classList.toggle('show', !en.isIntersecting));
      }, {threshold:0}).observe(document.querySelector('.detail-actions'));
    } else {
      bar.classList.add('show');
    }

    function refreshWa(){
      const url = sold
        ? WA_BASE + '?text=' + encodeURIComponent(st === 'soon'
            ? 'Hi Kiva Belion! Please let me know when ' + product.name + ' is available.'
            : 'Hi Kiva Belion! Is ' + product.name + ' coming back in stock?')
        : buildWhatsAppOrderUrl([{name:product.name, price:product.price, qty:qty}]);
      waBtn.href = url;
      soWa.href = url;
    }
    refreshWa();
    document.getElementById('detailQtyMinus').addEventListener('click', ()=>{
      qty = Math.max(1, qty-1); qtyVal.textContent = qty; refreshWa();
    });
    document.getElementById('detailQtyPlus').addEventListener('click', ()=>{
      qty = qty+1; qtyVal.textContent = qty; refreshWa();
    });
    document.getElementById('detailAddBtn').addEventListener('click', (e)=>{
      addToCart(product.id, qty);
      e.target.textContent = 'Added ✓';
      setTimeout(()=>{ e.target.textContent='Add to bag'; }, 1400);
    });

    // Related products: same category, excluding current
    const pool = product.inspiredBy ? INSPIRED : PRODUCTS;
    const related = pool.filter(p=>p.id!==product.id).slice(0,3);
    if(related.length){
      document.getElementById('relatedRoot').style.display = 'block';
      const relatedGrid = document.getElementById('relatedGrid');
      related.forEach(p=>renderProductCard(p, relatedGrid));
    }
  }
</script>
<script src="app.js?v=20261024d"></script>
</body>
</html>
